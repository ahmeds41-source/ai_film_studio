<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<title>AI Epic Studio Pro</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #6366f1;
  --accent-h: #4f46e5;
  --text: #f8fafc;
  --muted: #94a3b8;
  --border: #334155;
  --ok: #22c55e;
  --err: #ef4444;
  --warn: #f59e0b;
}

body.light {
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #475569;
  --border: #cbd5e1;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
}

header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.75rem;
}

header h1 {
  font-size: 1.2rem;
  color: #818cf8;
}

.h-actions {
  display: flex;
  gap: 0.5rem;
  align-items: center;
  flex-wrap: wrap;
}

.icb {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.5rem 0.75rem;
  border-radius: 0.4rem;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  min-height: 36px;
}

.icb:hover {
  border-color: var(--accent);
}

.icb:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.container {
  max-width: 1300px;
  margin: 2rem auto;
  padding: 0 1rem;
  width: 100%;
  flex: 1;
}

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
}

@media (min-width: 992px) {
  .grid {
    grid-template-columns: 1fr 1fr;
  }
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 1rem;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.card h2 {
  font-size: 1.1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.fg {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

label {
  font-size: 0.9rem;
  color: var(--muted);
}

textarea,
select,
input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 0.5rem;
  color: var(--text);
  padding: 0.75rem;
  font-size: 1rem;
  outline: none;
  width: 100%;
  min-height: 40px;
}

textarea {
  resize: vertical;
  min-height: 80px;
}

textarea:focus,
select:focus,
input:focus {
  border-color: var(--accent);
}

.main-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 0.5rem;
  padding: 0.75rem 1.5rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  width: 100%;
  min-height: 44px;
}

.main-btn:hover {
  background: var(--accent-h);
}

.main-btn:disabled {
  background: var(--border);
  cursor: not-allowed;
}

.dl-btn {
  background: var(--ok);
  color: #fff;
  border: none;
  border-radius: 0.5rem;
  padding: 0.6rem 1rem;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 40px;
}

.media-wrap {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 380px;
}

.media-box {
  background: var(--bg);
  border: 2px dashed var(--border);
  border-radius: 0.5rem;
  width: 100%;
  min-height: 340px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--muted);
  text-align: center;
  padding: 1rem;
  position: relative;
  overflow: hidden;
}

.load-box {
  display: none;
  flex-direction: column;
  gap: 0.75rem;
  width: 95%;
  text-align: right;
}

.load-box.active {
  display: flex;
}

.prog-bar {
  width: 100%;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.prog-fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.3s linear;
}

.log-box {
  display: none;
  text-align: right;
  font-family: monospace;
  color: #38bdf8;
  font-size: 0.8rem;
  white-space: pre-wrap;
  width: 100%;
  max-height: 100px;
  overflow-y: auto;
  padding: 0.5rem;
  background: rgba(15, 23, 42, 0.9);
  border-radius: 0.4rem;
}

.log-box.active {
  display: block;
}

img#previewImage {
  display: none;
  width: 100%;
  height: 100%;
  max-height: 65vh;
  border-radius: 0.5rem;
  object-fit: contain;
}

img#previewImage.active {
  display: block;
}

.badge {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  border-radius: 1rem;
  font-size: 0.8rem;
  background: rgba(34, 197, 94, 0.2);
  color: var(--ok);
}

.api-status {
  font-size: 0.8rem;
  padding: 0.4rem 0.75rem;
  border-radius: 0.4rem;
  background: rgba(34, 197, 94, 0.15);
  color: var(--ok);
  display: inline-block;
}

.api-status.mock {
  background: rgba(245, 158, 11, 0.15);
  color: var(--warn);
}

footer {
  text-align: center;
  padding: 1.5rem;
  color: var(--muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  margin-top: auto;
}

#toasts {
  position: fixed;
  top: 1rem;
  left: 1rem;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.toast {
  padding: 0.75rem 1rem;
  border-radius: 0.5rem;
  color: #fff;
  font-size: 0.9rem;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
}

.toast.success { background: var(--ok); }
.toast.error { background: var(--err); }
.toast.info { background: var(--accent); }
.toast.warning { background: var(--warn); }
</style>
</head>
<body>

<header>
<h1>🎬 AI Epic Studio Pro</h1>
<div class="h-actions">
<span class="badge" id="connBadge">● متصل</span>
<button class="icb" id="themeToggle" onclick="toggleTheme()">🌗</button>
</div>
</header>

<div class="container">
<div class="grid">
<div>
<div class="card">
<h2>إعدادات التوليد</h2>
<div class="fg"><label for="prompt">وصف المشهد (Prompt)</label>
<textarea id="prompt" placeholder="اكتب وصفاً تفصيلياً بالإنجليزية للحصول على أفضل نتيجة..."></textarea></div>
<button class="main-btn" id="generateBtn" onclick="startGeneration()">توليد وإنتاج ✨</button>
<button class="icb" id="stopBtn" style="display:none;background:var(--err);color:#fff;" onclick="stopGeneration()">⛔ إيقاف</button>
</div>

<div class="card">
<h2>إعدادات API (Hugging Face) 🔌</h2>
<div style="font-size:.75rem;color:var(--warn);background:rgba(245,158,11,.1);padding:.5rem;border-radius:.4rem;margin-bottom:.5rem">
ضع مفتاح Hugging Face Access Token الخاص بك هنا لتوليد صور حقيقية، أو اتركه فارغاً للاستجابة بوضع المحاكاة.
</div>
<div class="fg"><label for="apiKey">Hugging Face Token:</label>
<input type="password" id="apiKey" placeholder="hf_..."></div>
<button class="icb" style="margin-top:.5rem" onclick="saveApiSettings()">💾 حفظ المفتاح</button>
<div id="apiStatus" class="api-status mock" style="margin-top:.5rem">⚠️ وضع المحاكاة</div>
</div>
</div>

<div>
<div class="card">
<h2>معاينة النتيجة</h2>
<div class="media-wrap">
<div class="media-box" id="mediaBox">
<div id="placeholder">ستظهر هنا معاينة النتيجة ✨</div>
<img id="previewImage" alt="معاينة">
<div class="load-box" id="loadBox">
<div class="phase" id="phaseInd">جارٍ المعالجة...</div>
<div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
<div class="log-box" id="outLog"></div>
</div>
</div>
</div>
<button class="dl-btn" id="dlBtn" style="display:none; margin-top:0.5rem;" onclick="downloadResult()">⬇️ تحميل النتيجة</button>
</div>
</div>
</div>
</div>

<footer>AI Epic Studio Pro &copy; <span id="year"></span></footer>
<div id="toasts"></div>

<script>
let isGenerating = false, abortController = null, currentResultBlob = null;

function showToast(msg, type = 'info') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function toggleTheme() {
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
}

function saveApiSettings() {
  const k = document.getElementById('apiKey').value.trim();
  if (k) sessionStorage.setItem('hfKey', k); else sessionStorage.removeItem('hfKey');
  updateApiStatus();
  showToast('تم حفظ المفتاح بنجاح', 'success');
}

function updateApiStatus() {
  const k = sessionStorage.getItem('hfKey');
  const el = document.getElementById('apiStatus');
  if (k) { el.textContent = '✅ متصل بـ Hugging Face (حقيقي)'; el.classList.remove('mock'); }
  else { el.textContent = '⚠️ وضع المحاكاة'; el.classList.add('mock'); }
}

async function startGeneration() {
  if (isGenerating) return;
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) { showToast('الرجاء كتابة وصف المشهد أولاً', 'error'); return; }

  const token = sessionStorage.getItem('hfKey');
  isGenerating = true;
  abortController = new AbortController();

  const generateBtn = document.getElementById('generateBtn');
  const stopBtn = document.getElementById('stopBtn');
  generateBtn.disabled = true;
  generateBtn.textContent = '⏳ جارٍ التوليد...';
  stopBtn.style.display = 'block';

  const loadingBox = document.getElementById('loadBox');
  const outputLog = document.getElementById('outLog');
  const progressFill = document.getElementById('progFill');
  const phaseIndicator = document.getElementById('phaseInd');
  const placeholderText = document.getElementById('placeholder');
  const previewImage = document.getElementById('previewImage');
  const downloadBtn = document.getElementById('dlBtn');

  placeholderText.style.display = 'none';
  previewImage.classList.remove('active');
  previewImage.removeAttribute('src');
  downloadBtn.style.display = 'none';

  loadingBox.classList.add('active');
  outputLog.classList.add('active');
  outputLog.textContent = '🚀 بدء تنفيذ الطلب...\n';
  progressFill.style.width = '40%';

  try {
    if (token) {
      phaseIndicator.textContent = 'الاتصال بـ Hugging Face API...';
      outputLog.textContent += 'إرسال إلى نموذج Stable Diffusion...\n';
      
      const response = await fetch("https://api-inference.huggingface.co/models/runwayml/stable-diffusion-v1-5", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ inputs: prompt }),
        signal: abortController.signal
      });

      if (!response.ok) throw new Error('فشل الخادم برمز ' + response.status);

      const blob = await response.blob();
      currentResultBlob = blob;
      progressFill.style.width = '100%';
      phaseIndicator.textContent = '✅ اكتمل التوليد!';
      
      previewImage.src = URL.createObjectURL(blob);
      previewImage.classList.add('active');
      downloadBtn.style.display = 'block';
      showToast('✅ تم توليد الصورة الحقيقية بنجاح!', 'success');
    } else {
      // وضع المحاكاة الذكي للاختبار الفوري
      phaseIndicator.textContent = 'تشغيل وضع المحاكاة...';
      await new Promise(r => setTimeout(r, 1500));
      progressFill.style.width = '100%';
      
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="100%" height="100%" fill="#6366f1"/><text x="50%" y="50%" fill="white" font-size="22" text-anchor="middle" font-family="sans-serif">${prompt}</text></svg>`;
      currentResultBlob = new Blob([svg], { type: 'image/svg+xml' });
      
      previewImage.src = URL.createObjectURL(currentResultBlob);
      previewImage.classList.add('active');
      downloadBtn.style.display = 'block';
      phaseIndicator.textContent = '✅ اكتملت المحاكاة!';
      showToast('تم التوليد (وضع المحاكاة)', 'info');
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      showToast('❌ خطأ: ' + err.message, 'error');
      outputLog.textContent += 'خطأ: ' + err.message + '\n';
    } else {
      showToast('تم إيقاف العملية', 'warning');
    }
  } finally {
    isGenerating = false;
    generateBtn.disabled = false;
    generateBtn.textContent = 'توليد وإنتاج ✨';
    stopBtn.style.display = 'none';
    loadingBox.classList.remove('active');
    outputLog.classList.remove('active');
  }
}

function stopGeneration() {
  if (abortController) abortController.abort();
  isGenerating = false;
  document.getElementById('generateBtn').disabled = false;
  document.getElementById('generateBtn').textContent = 'توليد وإنتاج ✨';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('loadBox').classList.remove('active');
  document.getElementById('placeholder').style.display = 'block';
  showToast('تم الإيقاف', 'warning');
}

function downloadResult() {
  if (!currentResultBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(currentResultBlob);
  a.download = 'ai_image_' + Date.now() + '.png';
  a.click();
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('year').textContent = new Date().getFullYear();
  if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
  if (sessionStorage.getItem('hfKey')) {
    document.getElementById('apiKey').value = sessionStorage.getItem('hfKey');
  }
  updateApiStatus();
});
</script>
</body>
</html>
